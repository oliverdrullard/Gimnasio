
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar evaluación física</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #252525;
            font-size: 13px;
        }

        .form-container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 16px 15px;
            border: 1px solid #e5e5eb;
            border-radius: 13px;
            background-color: #fff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        label,
        .group-label {
            font-size: 11px;
            font-weight: 700;
            color: #555561;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #e5e5eb;
            border-radius: 9px;
            background-color: #fff;
            color: #252525;
            font: inherit;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input,
        select {
            height: 36px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #f4510b;
            box-shadow: 0 0 0 2px rgb(244 81 11 / 10%);
        }

        input::placeholder,
        textarea::placeholder {
            color: #858585;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        /* Oculta el radio original, pero mantiene su accesibilidad */
        .option input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .option {
            position: relative;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }

        .option span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 29px;
            padding: 6px 12px;
            border: 1px solid #e5e5eb;
            border-radius: 20px;
            background-color: #fff;
            color: #252525;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .option input:checked + span {
            border-color: #ff5a1f;
            background-color: #fff3ed;
            color: #e9470b;
        }

        .option input:focus-visible + span {
            outline: 2px solid #f4510b;
            outline-offset: 2px;
        }

        textarea {
            min-height: 55px;
            resize: vertical;
        }

        .submit-button {
            width: 100%;
            min-height: 36px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: #f4510b;
            color: white;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-button:hover {
            background-color: #d94305;
        }

        .submit-button:focus-visible {
            outline: 2px solid #f4510b;
            outline-offset: 3px;
        }

        .confirmation {
            margin: -7px 0 0;
            color: #555561;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 520px) {
            body {
                padding: 10px;
            }

            .form-container {
                padding: 14px 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 13px;
            }

            .full-width {
                grid-column: auto;
            }

            .options {
                gap: 6px;
            }

            .option span {
                padding: 6px 10px;
            }
        }
    </style>
</head>

<body>

    <main class="form-container">
        <form id="evaluationForm">

            <div class="form-grid">

                <!-- Nombre completo -->
                <div class="form-group">
                    <label for="fullName">Nombre completo</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Ej: María Pérez"
                        autocomplete="name"
                        required
                    >
                </div>

                <!-- WhatsApp -->
                <div class="form-group">
                    <label for="whatsapp">WhatsApp</label>
                    <input
                        type="tel"
                        id="whatsapp"
                        name="whatsapp"
                        placeholder="(809) 000-0000"
                        autocomplete="tel"
                        required
                    >
                </div>

                <!-- Edad -->
                <div class="form-group">
                    <label for="age">Edad</label>
                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Años"
                        min="1"
                        max="120"
                        required
                    >
                </div>

                <!-- Plan de interés -->
                <div class="form-group">
                    <label for="plan">Plan que te interesa</label>
                    <select id="plan" name="plan" required>
                        <option value="pendiente">Todavía no sé</option>
                        <option value="mensual">Plan mensual</option>
                        <option value="trimestral">Plan trimestral</option>
                        <option value="personalizado">Plan personalizado</option>
                    </select>
                </div>

                <!-- Objetivo -->
                <div class="options-group full-width">
                    <span class="group-label">¿Cuál es tu objetivo?</span>

                    <div class="options">
                        <label class="option">
                            <input
                                type="radio"
                                name="goal"
                                value="bajar_peso"
                                checked
                                required
                            >
                            <span>Bajar de peso</span>
                        </label>

                        <label class="option">
                            <input
                                type="radio"
                                name="goal"
                                value="ganar_musculo"
                            >
                            <span>Ganar músculo</span>
                        </label>

                        <label class="option">
                            <input
                                type="radio"
                                name="goal"
                                value="salud_energia"
                            >
                            <span>Salud y energía</span>
                        </label>

                        <label class="option">
                            <input
                                type="radio"
                                name="goal"
                                value="rendimiento_deportivo"
                            >
                            <span>Rendimiento deportivo</span>
                        </label>
                    </div>
                </div>

                <!-- Experiencia -->
                <div class="options-group full-width">
                    <span class="group-label">Experiencia</span>

                    <div class="options">
                        <label class="option">
                            <input
                                type="radio"
                                name="experience"
                                value="principiante"
                                required
                            >
                            <span>Nunca he entrenado</span>
                        </label>

                        <label class="option">
                            <input
                                type="radio"
                                name="experience"
                                value="menos_de_un_ano"
                                checked
                            >
                            <span>Menos de 1 año</span>
                        </label>

                        <label class="option">
                            <input
                                type="radio"
                                name="experience"
                                value="mas_de_un_ano"
                            >
                            <span>Más de 1 año</span>
                        </label>
                    </div>
                </div>

                <!-- Día preferido -->
                <div class="form-group">
                    <label for="preferredDay">Día preferido</label>
                    <select
                        id="preferredDay"
                        name="preferredDay"
                        required
                    >
                        <option value="lunes">Lunes</option>
                        <option value="martes">Martes</option>
                        <option value="miercoles" selected>
                            Miércoles
                        </option>
                        <option value="jueves">Jueves</option>
                        <option value="viernes">Viernes</option>
                        <option value="sabado">Sábado</option>
                        <option value="domingo">Domingo</option>
                    </select>
                </div>

                <!-- Hora preferida -->
                <div class="form-group">
                    <label for="preferredTime">Hora preferida</label>
                    <select
                        id="preferredTime"
                        name="preferredTime"
                        required
                    >
                        <option value="7:00_pm" selected>7:00 p. m.</option>
                        <option value="8:00_am">8:00 a. m.</option>
                        <option value="10:00_am">10:00 a. m.</option>
                        <option value="12:00_pm">12:00 p. m.</option>
                        <option value="4:00_pm">4:00 p. m.</option>
                        <option value="6:00_pm">6:00 p. m.</option>
                    </select>
                </div>

                <!-- Información médica -->
                <div class="form-group full-width">
                    <label for="medicalInfo">
                        ¿Alguna lesión o condición médica? (opcional)
                    </label>

                    <textarea
                        id="medicalInfo"
                        name="medicalInfo"
                        placeholder="Ej: dolor de rodilla, hipertensión controlada..."
                    ></textarea>
                </div>

                <!-- Envío -->
                <div class="full-width">
                    <button type="submit" class="submit-button">
                        Agendar mi evaluación gratis
                    </button>
                </div>

                <p class="confirmation full-width">
                    Te confirmamos por WhatsApp en menos de 1 hora.
                </p>

            </div>
        </form>
    </main>

    <script>
        const form = document.getElementById("evaluationForm");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!form.reportValidity()) {
                return;
            }

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            console.log("Datos de la evaluación:", data);

            alert(
                "Formulario validado correctamente. " +
                "Para confirmar tu cita, conecta este formulario " +
                "con tu backend o WhatsApp."
            );
        });
    </script>

</body>
</html>
